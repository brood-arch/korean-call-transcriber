[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-call-transcriber"
version = "0.5.0"
description = "Korean phone call transcription pipeline with Whisper + speaker diarization, auto TODO/schedule/entity extraction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Sinhyuk Lee"},
]
keywords = ["korean", "whisper", "transcription", "diarization", "todo", "obsidian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "faster-whisper>=1.0.0",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
]

[project.scripts]
kct-transcribe = "src.transcribe.batch_transcribe:main"
kct-extract = "src.extract.extract_all:main"
kct-health = "src.queue.gap_analyzer:main"
kct-sync-obsidian = "src.sync.sync_obsidian:main"

[project.optional-dependencies]
gpu = [
    "nvidia-ml-py3>=7.352.0",
    "torch>=2.0.0",
    "whisperx>=3.1.0",
]
queue = [
    "psycopg2-binary>=2.9.0",
]
mail = []
calendar = [
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
]
all = [
    "korean-call-transcriber[gpu,queue,calendar]",
]
dev = [
    "chromadb>=0.4.0",
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/extract/extract_entities.py" = ["E402"]
"src/extract/extract_schedules.py" = ["E402"]
"src/correct/corrections.py" = ["E402"]
