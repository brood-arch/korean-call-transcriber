[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-call-transcriber"
version = "1.1.1"
description = "Korean phone call transcription pipeline with Whisper + speaker diarization, auto TODO/schedule/entity extraction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Sinhyuk Lee"},
]
keywords = ["korean", "whisper", "transcription", "diarization", "todo", "obsidian"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "ffmpeg-python>=0.2.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
]

[project.scripts]
kct-transcribe = "kct.transcribe.batch_transcribe:main"
kct-extract = "kct.extract.extract_all:main"
kct-health = "kct.pipeline.health_check:main"
kct-gap = "kct.queue.gap_analyzer:main"
kct-sync-obsidian = "kct.sync.sync_obsidian:main"

[project.optional-dependencies]
gpu = [
    "faster-whisper>=1.0.0",
    "nvidia-ml-py3>=7.352.0",
    "torch>=2.0.0",
    "whisperx>=3.1.0",
]
queue = [
    "psycopg2-binary>=2.9.0",
]
mail = []
calendar = [
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
]
chromadb = [
    "chromadb>=0.4.0",
]
all = [
    "korean-call-transcriber[gpu,queue,calendar,chromadb]",
]
obsidian = []
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kct*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"kct/correct/corrections.py" = ["E402"]
"kct/pipeline/minions_queue.py" = ["E402"]
